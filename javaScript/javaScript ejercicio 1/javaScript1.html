<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Javscript1</title>
</head>
<body>
    <h1>elija un botón</h1>
    <form>
       <button id="boton1" onclick="botonElegido(1)">1</button>
       <button id="boton2" onclick="botonElegido(2)">2</button>
       <button id="boton3" onclick="botonElegido(3)">3</button>
    </form>
    <script>
        function botonElegido(numBoton) {
            alert("eligio el boton "+ numBoton)
        }
    </script>
</body>
</html>
