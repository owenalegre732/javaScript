<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>PIZZAS</h2>
    <select name="pizzas" id="pipshas" onchange="ValorPipshas()">
        <option value="">Elija el gusto</option>
        <option value="2000">Jamon y queso</option>
        <option value="2200">Morrón</option>
        <option value="1800">Muzzarella</option>
        
    </select>

    <br>

    <p>Precio: <input type="text" id="precio" readonly> $</p>



        <script>
            function ValorPipshas (){
                let pizzas = document.getElementById('pipshas');
                let precio = document.getElementById('precio');

                precio.value=pizzas.value;

            }
        </script>


    
</body>
</html>
