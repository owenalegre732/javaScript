<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <form>
        <p>ingrese el primer numero: <input type="text" name="numero1" id="num1"></p>
        <p>ingrese el segundo numero: <input type="text" name="numero2" id="num2"></p>
        <p><input type="button" value="confirmar" onclick="mayorMenor()"></p>
    </form>
    
    <script>
        function mayorMenor(){
            let num_1 = parseInt(document.getElementById('num1').value)
            let num_2 = parseInt(document.getElementById('num2').value)

            if (num_1>num_2){
                alert(num_1+ " "+ "es mayor que "+ num_2)
            } else{
                alert(num_1+ " "+ "es menor que "+ num_2)
            }
            
        }
    </script>
</body>
</html>
